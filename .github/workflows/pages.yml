# Builds the blog and publishes it with GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pandoc builds the pages; with LaTeX it typesets the PDF version of every article (fonts-extra has Libertine and the Romantik initials).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-fonts-extra-links lmodern
      - run: make
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
