# Builds the blog and publishes it with GitLab Pages on every push to the default branch.
pages:
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    paths:
      - node_modules/
  script:
    - npm ci
    # pandoc and LaTeX typeset the PDF version of every article (fonts-extra has the Romantik initials).
    - apt-get update && apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-fonts-extra lmodern fonts-linux-libertine
    # The site is served from a sub-path (e.g. /readandfocusblog/); take it from the Pages URL.
    - PREFIX="$(echo "$CI_PAGES_URL" | sed -E 's|^https?://[^/]+||')/"
    - npx eleventy --output=public --pathprefix="$PREFIX"
  artifacts:
    paths:
      - public
