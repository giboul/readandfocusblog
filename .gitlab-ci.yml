# Builds the blog and publishes it with GitLab Pages on every push to the default branch.
pages:
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # pandoc builds the pages; with LaTeX it typesets the PDF version of every article (fonts-extra has Libertine and the Romantik initials).
    - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-fonts-extra-links lmodern
    - make
  artifacts:
    paths:
      - public
